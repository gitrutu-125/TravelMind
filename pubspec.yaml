
name: trip_planner
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # Flutter localization
  flutter_localizations:
    sdk: flutter
  intl: any

  # Icons
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^16.2.0

  # API integration
  dio: ^5.9.0

  # Google Authentication
  google_sign_in: ^7.2.0

  # Local offline storage
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management
  provider: ^6.1.5

  # Images
  cached_network_image: ^3.4.1

  # Maps
  flutter_map: ^8.2.1
  latlong2: ^0.9.1

  # Location
  geolocator: ^14.0.2

  # HTTP and secure storage
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
